name: Gerar APK Marine Burger Administração

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair o arquivo ZIP automaticamente
        run: |
          unzip -q Marine_Burger_APK_Compilar_Online.zip -d projeto_extraido
          # Se os arquivos estiverem dentro de outra pasta interna, move para a raiz
          if [ -d "projeto_extraido/Marine-Burger--administra-o" ]; then
            mv projeto_extraido/Marine-Burger--administra-o/* .
          elif [ -d "projeto_extraido/"* ]; then
            mv projeto_extraido/*/* .
          else
            mv projeto_extraido/* .
          fi
        continue-on-error: true

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew
        continue-on-error: true

      - name: Compilar APK (Assemble Debug)
        run: ./gradlew assembleDebug

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarineBurger-Administracao-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
